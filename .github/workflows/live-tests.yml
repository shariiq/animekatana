name: Live Tests

on:
  # Manual trigger for on-demand live testing
  workflow_dispatch:

  # Weekly scheduled run (Sundays at 2 AM UTC)
  schedule:
    - cron: '17 2 * * 0'

  # Optional: run after successful main merge
  # push:
  #   branches: [main]

# Least-privilege permissions
permissions:
  contents: read

jobs:
  live-tests:
    name: Live External API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live tests
        id: live-tests
        run: npm test
        env:
          RUN_LIVE_TESTS: 'true'
        continue-on-error: true

      - name: Report live test status
        if: always()
        env:
          LIVE_TEST_OUTCOME: ${{ steps.live-tests.outcome }}
        run: |
          if [ "$LIVE_TEST_OUTCOME" = "success" ]; then
            echo "✓ Live tests passed"
          else
            echo "⚠ Live tests failed - this may be due to external API availability"
            echo "Live test failures do not block deployment"
          fi
